enum JobType {
  FULL_TIME
  PART_TIME
  INTERNSHIP
}

type Job {
  id: ID!
  title: String!
  description: String!
  company: Company!
  location: String!
  salary: Int!
  type: JobType!
  remote: Boolean!
  createdAt: DateTime!
  updatedAt: DateTime!
  isApplied: Boolean!
}

input SearchJobsInput {
  query: String!
}

input CreateJobInput {
  title: String!
  description: String!
  companyName: String!
  location: String!
  salary: Int!
  type: JobType!
  remote: Boolean!
}

input DeleteJobInput {
  id: ID!
}

input ApplyForJobInput {
  id: ID!
}

input CancleJobApplicationInput {
  id: ID!
}

type Query {
  searchJobs(input: SearchJobsInput!): [Job!]!
}

type Mutation {
  createJob(input: CreateJobInput): Job!
  deleteJob(input: DeleteJobInput): Boolean!
  applyForJob(input: ApplyForJobInput): Boolean!
  cancelJobApplication(input: CancleJobApplicationInput): Boolean!
}
